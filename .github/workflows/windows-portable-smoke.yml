name: Windows portable smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ads1299-2000hz-performance

permissions:
  contents: read

jobs:
  windows-portable-smoke:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Download the GitHub ZIP for this commit
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP "OpenBCI_GUI_ADS1299.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "github-download"
          $archiveUrl = "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip"
          Invoke-WebRequest -Uri $archiveUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath
          $packageRoot = Get-ChildItem -Path $extractPath -Directory | Select-Object -First 1
          if ($null -eq $packageRoot) {
            throw "GitHub ZIP did not contain a repository directory."
          }
          "PACKAGE_ROOT=$($packageRoot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify portable package contents
        shell: pwsh
        run: |
          $requiredPaths = @(
            "App\OpenBCI_GUI.exe",
            "App\java\bin\java.exe",
            "App\java\bin\javaw.exe",
            "App\lib\OpenBCI_GUI.jar",
            "App\lib\brainflow.jar",
            "App\lib\core.jar",
            "App\data\fonts\OpenSans-Regular.ttf",
            "App\data\EEG_Sample_Data",
            "Source\tools\ads129x_fake_sender.py",
            "Source\tools\ADS129xTcpIntegrationSmokeTest.java"
          )
          foreach ($relativePath in $requiredPaths) {
            $fullPath = Join-Path $env:PACKAGE_ROOT $relativePath
            if (-not (Test-Path $fullPath)) {
              throw "Missing required portable package path: $relativePath"
            }
          }

      - name: Run fake sender protocol self-test
        shell: pwsh
        run: |
          python "$env:PACKAGE_ROOT\Source\tools\ads129x_fake_sender.py" --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "ADS1299 fake sender self-test failed."
          }

      - name: Compile and run packaged TCP integration test
        shell: pwsh
        run: |
          $classes = Join-Path $env:RUNNER_TEMP "ads1299-smoke-classes"
          New-Item -ItemType Directory -Path $classes -Force | Out-Null
          $classpath = "$env:PACKAGE_ROOT\App\lib\*"
          $testSource = "$env:PACKAGE_ROOT\Source\tools\ADS129xTcpIntegrationSmokeTest.java"
          & javac -encoding UTF-8 -cp $classpath -d $classes $testSource
          if ($LASTEXITCODE -ne 0) {
            throw "ADS1299 TCP integration smoke test did not compile."
          }

          $env:OPENBCI_GUI_DATA_DIR = Join-Path $env:RUNNER_TEMP "custom-gui-data"
          & java -cp "$classes;$classpath" ADS129xTcpIntegrationSmokeTest
          if ($LASTEXITCODE -ne 0) {
            throw "ADS1299 TCP integration smoke test failed."
          }

      - name: Launch the downloaded Windows GUI without a D data directory
        shell: pwsh
        run: |
          Remove-Item Env:\OPENBCI_GUI_DATA_DIR -ErrorAction SilentlyContinue
          $legacyDataPath = "D:\OpenBCI_GUI_ADS1299\UserData"
          if (Test-Path $legacyDataPath) {
            throw "Runner unexpectedly contains the legacy D-drive data directory."
          }

          $defaultDataPath = Join-Path $env:LOCALAPPDATA "OpenBCI_GUI_ADS1299\UserData"
          if (Test-Path $defaultDataPath) {
            Remove-Item -Path $defaultDataPath -Recurse -Force
          }

          $executable = Join-Path $env:PACKAGE_ROOT "App\OpenBCI_GUI.exe"
          $workingDirectory = Join-Path $env:PACKAGE_ROOT "App"
          $process = Start-Process -FilePath $executable -WorkingDirectory $workingDirectory -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          $ready = $false
          $latestLog = $null

          try {
            while ((Get-Date) -lt $deadline) {
              $consoleDirectory = Join-Path $defaultDataPath "Console_Data"
              if (Test-Path $consoleDirectory) {
                $latestLog = Get-ChildItem -Path $consoleDirectory -Filter "Console_*.txt" |
                  Sort-Object LastWriteTime -Descending |
                  Select-Object -First 1
                if ($null -ne $latestLog) {
                  $setupComplete = Select-String -Path $latestLog.FullName -Pattern "OpenBCI_GUI::Setup: Setup is complete!" -Quiet
                  if ($setupComplete) {
                    $ready = $true
                    break
                  }
                }
              }
              Start-Sleep -Seconds 2
            }

            if (-not $ready) {
              if ($null -ne $latestLog) {
                Get-Content -Path $latestLog.FullName
              }
              throw "Downloaded OpenBCI_GUI.exe did not complete startup within 90 seconds."
            }

            $requiredDirectories = @("Recordings", "Settings", "Console_Data", "Sample_Data")
            foreach ($directory in $requiredDirectories) {
              if (-not (Test-Path (Join-Path $defaultDataPath $directory))) {
                throw "GUI did not create required data directory: $directory"
              }
            }

            Write-Host "Downloaded Windows GUI reached setup complete without a legacy D-drive data directory."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
            Get-Process -Name "javaw" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
